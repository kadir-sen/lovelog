# Lightsail (host'ta nginx + certbot olduğu senaryo) için sadeleştirilmiş compose.
# - lovelog (web): statik nginx + dist, 127.0.0.1:8080 → container:80
# - api (Fastify): Gemini proxy, 127.0.0.1:3001 → container:3001
# Host nginx /api/* → 127.0.0.1:3001, kalan her şey → 127.0.0.1:8080.
#
# Kullanım: docker compose -f docker-compose.lightsail.yml up -d --build

services:
  lovelog:
    build:
      context: .
      dockerfile: Dockerfile
    image: lovelog:latest
    container_name: lovelog
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx-internal.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: lovelog-api:latest
    container_name: lovelog-api
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: "3001"
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: "https://lovelog-sude.duckdns.org,capacitor://localhost,https://localhost,http://localhost:3000,http://localhost:3002"
      LOG_LEVEL: "info"
      DATA_DIR: "/data"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      # Host path: /opt/lovelog-data (sunucuda mkdir + chown ile hazırlanır).
      # SQLite veritabanı (chats) burada persist edilir, container restart'lara dayanır.
      - /opt/lovelog-data:/data
    restart: unless-stopped
