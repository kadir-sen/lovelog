# Lightsail HOST'unda /etc/nginx/sites-available/lovelog-sude.duckdns.org olarak yer alır.
# certbot --nginx ilk kez çalıştırıldığında bu dosyaya 443 server bloğunu ve SSL satırlarını
# kendisi otomatik ekler. İlk kurulum için sadece port 80 yeterli.
#
# mvp-api default server olarak ayrı bir config'te (ya da bu makinede mevcut nginx kurulumunda)
# IP ile gelen istekleri 127.0.0.1:8000'e proxy_pass eder.

server {
    listen 80;
    listen [::]:80;
    server_name lovelog-sude.duckdns.org;

    # certbot HTTP-01 challenge için (certbot --nginx ekleyebilir; el ile webroot kullanırsan gerekir)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
