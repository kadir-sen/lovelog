# Default server: IP ile gelen tüm istekler (Host header lovelog-sude.duckdns.org DEĞİLSE)
# mvp-api'ye gider. Lightsail HOST'unda /etc/nginx/sites-available/default olarak yer alır.
# default_server flag'i bu bloğu fallback yapar.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # mvp-api uzun-yaşayan bağlantı kullanıyorsa (websocket, SSE) bunlar gerekebilir:
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout                 300s;
    }
}
